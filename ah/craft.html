<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>專業獲利表</title>
<style>
:root{--bg:#0d0b0a;--panel:#17130f;--line:#3a2e20;--gold:#e8c26b;--gold2:#b8913f;--text:#ece3d2;--dim:#a8998a;--up:#4fc46a;--down:#e06054}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(ellipse at top,#2a1d10 0,#0d0b0a 60%) fixed;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
a{color:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
h1{color:var(--gold);margin:6px 0 2px;font-size:28px}
.dim{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
input[type=search]{flex:1;min-width:200px;background:#0b0907;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 12px;font-size:15px}
.chip{border:1px solid var(--line);background:#1f1913;color:var(--dim);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--gold2);color:var(--gold);background:#2b2014}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:36px 1fr auto;gap:4px 10px;align-items:center}
.ic{width:36px;height:36px;border-radius:5px;border:1px solid #000;background:#222 center/cover;grid-row:span 2}
.nm{font-weight:700}
.mats{grid-column:2/4;color:var(--dim);font-size:12.5px}
.nums{display:flex;gap:14px;flex-wrap:wrap;grid-column:2/4;font-size:13px}
.nums b{color:var(--gold);font-weight:500}
.roi{font-size:20px;font-weight:700;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.g{color:#ffd700}.s{color:#c7c7cf}.c{color:#d18a52}
.note{background:#17130f;border-left:3px solid var(--gold2);padding:8px 12px;border-radius:4px;color:var(--dim);font-size:13px;margin:10px 0}
</style></head><body><div class="wrap">
<a href="./">← 回拍賣場</a>
<h1 id="ttl">專業獲利表</h1>
<div class="dim" id="upd"></div>
<div class="note">每小時跟著拍賣場自動更新。成本＝材料照 AH 一般價買（助熔劑、線這類用商人價）；淨賺已扣 AH 5% 手續費；CP 值＝淨賺 ÷ 成本。「每小時賣出」是成品的估計成交量（看不出被買走還是賣家取消，所以是估計）。商店收購價全部低於成本，所以只算 AH。</div>
<div class="bar"><input type="search" id="q" placeholder="搜尋成品或材料…"></div>
<div class="bar" id="flt">
 <span class="chip on" data-f="sell">只看賣得掉（每小時有成交或架上 30 筆以上）</span>
 <span class="chip on" data-f="profit">只看會賺</span>
 <span class="chip" data-f="cheap">成本 1 金以下</span>
</div>
<div class="bar" id="srt">排序：
 <span class="chip on" data-s="roi">CP 值</span><span class="chip" data-s="p">每個淨賺</span><span class="chip" data-s="hr">每小時可賺</span><span class="chip" data-s="sold">賣最快</span>
</div>
<div id="list"></div>
</div>
<script>
(function(){
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(cp){var neg=cp<0;cp=Math.abs(Math.round(cp||0));var g=Math.floor(cp/10000),s=Math.floor(cp%10000/100),c=cp%100,o='';
 if(g)o+='<span class="g">'+g.toLocaleString()+'金</span> ';if(s)o+='<span class="s">'+s+'銀</span> ';if(!g&&(c||!s))o+='<span class="c">'+c+'銅</span>';return (neg?'-':'')+o.trim()}
var QC={POOR:'#9d9d9d',COMMON:'#fff',UNCOMMON:'#1eff00',RARE:'#0070dd',EPIC:'#a335ee',LEGENDARY:'#ff8000'};
var prof=(location.hash||'#blacksmithing').slice(1);
var NAMES={blacksmithing:'鍛造',leatherworking:'製皮',tailoring:'裁縫',engineering:'工程學',alchemy:'鍊金術',enchanting:'附魔',cooking:'烹飪',jewelcrafting:'珠寶'};
var sc=document.createElement('script');sc.src='craft_'+prof+'.js?'+Date.now();sc.onload=init;sc.onerror=function(){$('list').innerHTML='<div class="dim">還沒有這個專業的資料</div>'};document.body.appendChild(sc);
function init(){var C=window.CRAFT||{rows:[]};$('ttl').textContent=(NAMES[prof]||C.prof)+' 獲利表';
 $('upd').textContent='更新：'+new Date(C.updated*1000).toLocaleString('zh-TW',{hour12:false})+'・US PvP 聯盟拍賣場';
 var rows=C.rows.filter(function(r){return r.cost_ok&&r.ah>0&&r.cost>0});
 rows.forEach(function(r){r.roi=r.p_ah/r.cost;r.hr=r.sold>0?r.p_ah*r.sold/Math.max(1,r.qty):0});
 var F={sell:1,profit:1,cheap:0},S='roi',q='';
 $('flt').onclick=function(e){var t=e.target.closest('.chip');if(!t)return;var k=t.getAttribute('data-f');F[k]=F[k]?0:1;t.classList.toggle('on');draw()};
 $('srt').onclick=function(e){var t=e.target.closest('.chip');if(!t)return;S=t.getAttribute('data-s');[].forEach.call($('srt').querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===t)});draw()};
 $('q').oninput=function(){q=this.value.trim().toLowerCase();draw()};
 function draw(){var r=rows.filter(function(x){if(F.sell&&!(x.sold>0||x.ah_n>=30))return false;if(F.profit&&x.p_ah<=0)return false;if(F.cheap&&x.cost>10000)return false;
  if(q&&(x.item+' '+x.recipe+' '+x.mats).toLowerCase().indexOf(q)<0)return false;return true});
  r.sort(function(a,b){return (b[S]||0)-(a[S]||0)});
  $('list').innerHTML=r.slice(0,200).map(function(x){return '<div class="card"><span class="ic" style="'+(x.icon?'background-image:url('+esc(x.icon)+')':'')+'"></span>'+
   '<span class="nm" style="color:'+(QC[x.q]||'#fff')+'">'+esc(x.item)+(x.qty>1?' ×'+x.qty:'')+'</span><span class="roi '+(x.roi>=0?'up':'down')+'">'+(x.roi*100).toFixed(0)+'%</span>'+
   '<div class="nums"><span>成本 <b>'+money(x.cost)+'</b></span><span>AH <b>'+money(x.ah)+'</b></span><span>淨賺 <b class="'+(x.p_ah>=0?'up':'down')+'">'+money(x.p_ah)+'</b></span><span>每小時賣 <b>'+(x.sold>0?x.sold:'—')+'</b></span><span>架上 <b>'+x.ah_n+'</b> 筆</span></div>'+
   '<div class="mats">'+esc(x.mats)+'</div></div>'}).join('')||'<div class="dim">沒有符合條件的配方</div>'}
 draw()}
})();
</script></body></html>
