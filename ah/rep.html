 var path='',cur=null;for(var i=0;i<pts.length;i++){var p=pts[i];if(p=='BOAT'){if(cur)s+='<polyline points="'+path+'" class="rt"/>';s+='<polyline points="'+cur[0]+','+cur[1]+' '+MENETHIL[0]+','+MENETHIL[1]+'" class="rt"/><path d="M'+MENETHIL[0]+','+MENETHIL[1]+' Q560,300 '+THERAMORE[0]+','+THERAMORE[1]+'" class="boat"/><text x="560" y="285" class="bl">⛵ 米奈希爾港 → 塞拉摩</text>';path=THERAMORE[0]+','+THERAMORE[1]+' ';cur=THERAMORE;continue}path+=p[0]+','+p[1]+' ';cur=p}

 seq.forEach(function(z,i){var p=ZPOS[z],n=by[z].length;s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="13" class="stop"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" class="sn">'+(i+1)+'</text><text x="'+(LEFT[z]?p[0]-17:p[0]+17)+'" y="'+(p[1]+5)+'" class="sl"'+(LEFT[z]?' text-anchor="end"':'')+'>'+esc(ZN[z]||z)+'（'+n+'）</text>'});

 h+='<ol class="route">'+seq.map(function(z,i){return '<li><b>'+(i+1)+'. '+esc(ZN[z]||z)+'</b> <span class="dim">'+esc(z)+'・飛行點：'+esc(FP[z]||'—')+'</span><ul>'+by[z].map(function(r){return '<li><span class="t t'+r.t+'">'+TN[r.t]+'</span>'+esc(r.zh)+(r.extra?' <span class="t" style="color:#6cb4e0">順路</span>':'')+' → <b>'+esc(r.npc)+'</b> <span class="dim">'+dtxt(r)+'・'+esc(r.en)+'・先付 '+money(r.pay)+'（令狀＋物品），交完拿回 '+money(r.back)+'，淨 '+money(r.net)+'</span></li>'}).join('')+'</ul></li>'}).join('')+'</ol>';
 return h}
