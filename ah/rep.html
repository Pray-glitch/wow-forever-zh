 h+='<table><tr><th>#</th><th>訂單</th><th>區域・顧客</th><th class="n">淨成本</th><th class="n">聲望</th><th class="n">每千聲望</th></tr>'+
  top.map(function(r,i){var short=r.wn<1||r.inn<1;return '<tr><td>'+(i+1)+'</td><td><span class="t t'+r.t+'">'+TN[r.t]+'</span>'+esc(r.zh)+(r.prof=='鍛造'?' <span class="bs">鍛造</span>':'')+'<div class="dim">'+esc(r.en)+'・'+r.prof+(short?'・<span style="color:#e06c6c">架上缺貨</span>':'')+'</div></td><td>'+esc(ZN[r.z]||r.z)+(NEAR[r.z]?' <span class="t" style="color:#4fc46a">近</span>':'')+'<div class="dim">'+esc(r.npc)+'</div></td><td class="n">'+money(r.net)+'</td><td class="n">'+r.rep+'</td><td class="n">'+money(r.per)+'</td></tr>'}).join('')+
  '<tr><td></td><td><b>一天合計</b></td><td></td><td class="n">'+money(wAvg)+'</td><td class="n">'+wRep.toLocaleString()+'</td><td class="n">'+money(wRep?wAvg/wRep*1000:null)+'</td></tr></table>';
 h+='<div class="note">排序是每千聲望由便宜到貴；架上缺貨的那張當天跳過、改交第 21、22 名（看「令狀」分頁）。</div>';
 h+='<h2>路線二：趕時間，一天衝完（空箱＋偽造收據）</h2><ol class="steps">';
 if(!lab)h+='<li>先填 1 個運送箱交出去，觸發<b>出貨標籤</b>任務：+2,000 聲望、+50 青睞。</li>';
 if(toF>0)h+='<li>偽造收據要<b>友好</b>（3,000）才買得到：先交 '+nF+' 張最便宜的高級令狀補到友好，約 '+money(fCost)+'。</li>';
 h+='<li>拍賣場買 <b>'+nR+'</b> 個最便宜的空箱子（現在 '+(ec?esc(ec.n)+' '+money(ec.m):'—')+'），在營地向無照文書買 '+nR+' 張偽造收據（15 青睞一張，共 '+(nR*15).toLocaleString()+' 青睞），交出去 +'+(nR*50).toLocaleString()+' 聲望。</li>';
 var nC=bc?Math.ceil(nR*15/bc.fav):0;
 h+='<li>收據要的 '+(nR*15).toLocaleString()+' 青睞：買 <b>'+nC+'</b> 個'+(bc?esc(bc.zh)+'箱＋'+(nC*bc.q)+' 個'+esc(bc.matzh):'')+'，填好交出去。</li>';
 h+='<li>總花費約 <b>'+money(bTot)+'</b>（不含圖紙青睞），一天在赤脊山營地做完，但比路線一貴很多，青睞大部分花在收據上。</li></ol>';
 if(bc&&(nC*bc.q>bc.avail||nC>bc.cn))h+='<div class="note">⚠ 架上只有 '+bc.cn+' 個'+esc(bc.zh)+'箱、'+bc.avail+' 個'+esc(bc.matzh)+'，不夠 '+nC+' 箱：不夠的用「填箱子」分頁第二、三便宜的補。一次大量買價格會往上漲。</div>';
 if(ec&&nR>ec.t)h+='<div class="note">⚠ 最便宜的空箱子架上只有 '+ec.t+' 個，其他種類的空箱子也可以用（偽造收據不挑種類）。</div>';
 return h}
function writs(){var h='<div class="note">一張令狀的成本＝令狀＋要交的東西－交完拿到的錢袋（中級約 33 銀、高級約 70 銀、專家級約 75 銀）。同一張訂單一天只能交一次，不同的一天交幾張都可以。離赤脊山營地近的區域排前面，其次依每千聲望的成本排；點標題展開。<span class="bs">鍛造</span>＝你可以自己做。</div>';
 ZONES.forEach(function(z,i){h+='<div class="card"><div class="hd" data-z="'+i+'"><h3>'+esc(ZN[z.z]||z.z)+' <span class="dim">'+esc(z.z)+'</span>'+(NEAR[z.z]?' <span class="t" style="color:#4fc46a">離赤脊山營地近</span>':'')+'</h3><span>'+z.ok+' 張・<span class="big">'+z.rep.toLocaleString()+'</span> 聲望・'+money(z.cost)+'・每千 '+money(z.rep?z.per:null)+'</span></div>'+
  '<table id="z'+i+'" style="display:'+(i<3?'table':'none')+'"><tr><th>訂單</th><th>顧客</th><th class="n">令狀</th><th class="n">東西</th><th class="n">淨成本</th><th class="n">每千聲望</th></tr>'+
  z.rows.map(function(r){return '<tr><td><span class="t t'+r.t+'">'+TN[r.t]+'</span>'+esc(r.zh)+(r.prof=='鍛造'?' <span class="bs">鍛造</span>':'')+'<div class="dim">'+esc(r.en)+'・'+r.prof+'</div></td><td>'+esc(r.npc)+'</td><td class="n">'+money(r.wp)+'<div class="dim">'+r.wn+' 個</div></td><td class="n">'+money(r.ip)+'<div class="dim">'+r.inn+' 個</div></td><td class="n">'+money(r.net)+'</td><td class="n">'+money(r.per)+'</td></tr>'}).join('')+'</table></div>'});
 h+='<div class="dim">還有 6 張高級、32 張專家級令狀還不知道顧客在哪，沒列進來。顧客與區域整理自 ConquestCapped（11/18），遊戲裡以任務說明為準。</div>';return h}
function crates(){var ec=emptyCrate();var h='<div class="note">運送箱只要填其中一組材料；這裡列的是目前已知最便宜的一組（outof.games 整理），其他組合看箱子說明。空箱子自己打怪也會掉。最便宜的空箱子現在是 '+(ec?esc(ec.n)+' '+money(ec.m):'—')+'（拿來配偽造收據用）。</div><table><tr><th>箱子</th><th>材料</th><th class="n">箱子</th><th class="n">材料</th><th class="n">一箱合計</th><th class="n">青睞</th><th class="n">每點青睞</th></tr>'+
 CRATES.map(function(c){return '<tr><td>'+esc(c.zh)+'</td><td>'+esc(c.matzh)+' ×'+c.q+'<div class="dim">架上 '+c.avail+' 個</div></td><td class="n">'+money(c.cp)+'</td><td class="n">'+money(c.mp!=null?c.mp*c.q:null)+'</td><td class="n">'+money(c.tot)+'</td><td class="n">'+c.fav+'</td><td class="n">'+money(c.pf)+'</td></tr>'}).join('')+'</table>';return h}
function draw(){[].forEach.call($('tabs').querySelectorAll('.chip'),function(x){x.classList.toggle('on',x.getAttribute('data-t')==TAB)});
 $('view').innerHTML=TAB=='sum'?sum():TAB=='writ'?writs():crates()}
$('tabs').onclick=function(e){var t=e.target.closest('.chip');if(!t)return;TAB=t.getAttribute('data-t');draw()};
$('view').onclick=function(e){var t=e.target.closest('.hd');if(!t)return;var tb=$('z'+t.getAttribute('data-z'));tb.style.display=tb.style.display=='none'?'table':'none'};
['cur','fav','lab'].forEach(function(i){$(i).oninput=$(i).onchange=function(){try{localStorage.setItem('rep_'+i,$(i).type=='checkbox'?($(i).checked?'1':''):$(i).value)}catch(e){}if(TAB=='sum')draw()}});
try{['cur','fav'].forEach(function(i){var v=localStorage.getItem('rep_'+i);if(v!=null&&v!=='')$(i).value=v});if(localStorage.getItem('rep_lab'))$('lab').checked=true}catch(e){}
load()})();
</script></body></html>
