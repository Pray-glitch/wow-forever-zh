<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永恆攻略中文版</title>
<style>
:root{--zone:#4fd1c5;--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e6e8ee;--muted:#9aa3b2;--accent:#e8b500;--link:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--link)}
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .logo{font-weight:800;letter-spacing:.5px;color:var(--accent)}
.top .sub{color:var(--muted);font-size:13px}
.top button{margin-left:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
nav h4{margin:14px 8px 6px;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--panel2);color:var(--accent);font-weight:600}
nav .d{color:var(--muted);font-size:12px;margin-left:4px}
nav a.top{font-weight:600;font-size:15px;margin-top:2px}
nav a.top.ext{font-weight:500}
nav .sub{display:none;margin:0 0 4px 14px;border-left:1px solid var(--line);padding-left:4px}
nav .sub.open{display:block}
nav .sub a{font-size:13.5px;padding:6px 10px}
nav .sub a.more{color:var(--muted);font-size:12px}
nav a.grp::after{content:'▸';float:right;color:var(--muted)}
nav a.grp.open::after{content:'▾'}
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:980px}
.meta{color:var(--muted);font-size:13px;margin-bottom:14px}
.meta a{color:var(--link)}
main h1{font-size:28px;margin:6px 0 10px}
main h2{font-size:22px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
main h3{font-size:18px;margin:24px 0 8px;color:var(--accent)}
main p{margin:10px 0}
main ul{padding-left:22px}
main li{margin:4px 0}
main img.shot{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:10px 0;display:block}
main .cap{color:var(--muted);font-size:13px;margin:-4px 0 14px}
main table{border-collapse:collapse;margin:10px 0;font-size:14px}
main td,main th{border:1px solid var(--line);padding:6px 10px}
main blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:4px 14px;color:var(--muted)}
.home .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;cursor:pointer}
.home .card:hover{border-color:var(--accent)}
.home .card b{font-size:16px}
.home .card .c{color:var(--muted);font-size:13px}
.home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.home .grid .card{margin:0}
.home a.dcard{display:block;text-decoration:none;color:var(--text)}
.home .grid.dg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.home .tip{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);margin:10px 0}
.home .tip b{color:var(--text)}
.home .grid.sec{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.home .card.tile{position:relative;padding:14px 14px 12px}
.home .card.tile .ti{font-size:22px;display:block;margin-bottom:4px}
.home .card.tile .n{position:absolute;top:12px;right:12px;color:var(--accent);font-size:13px;font-weight:700}
.home .grid.cls{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media (max-width:820px){.home .grid.sec{grid-template-columns:1fr 1fr}.home .grid.cls{grid-template-columns:1fr 1fr 1fr;gap:8px}.home .grid.cls .card{padding:10px 8px;text-align:center}.home .grid.cls .card b{font-size:14px}.home h2{margin-top:20px}}
.home h2{font-size:18px;margin:26px 0 8px;border:0}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0 20px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.toc b{width:100%;color:var(--muted);font-size:12px}
.toc a{text-decoration:none}
nav a.cls{font-weight:600}
nav .sub .sub{margin-left:10px}
main b.w,main a.w{font-weight:600;white-space:nowrap}
main a.zone,main a.w.zone{color:var(--zone)}
main a.it{text-decoration:none;border-bottom:1px dotted currentColor}
main a.it:hover{border-bottom-style:solid}
main img.ic{width:18px;height:18px;vertical-align:-4px;margin-right:3px;border-radius:3px;border:1px solid #000}
main h2 img.ic,main h3 img.ic,main h4 img.ic{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:6px}
main code{white-space:pre-wrap}
.tabs{margin:12px 0 18px}
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabbar .tab{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabbar .tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.rp-btn{position:fixed;right:16px;bottom:18px;z-index:20;display:none;background:var(--accent);color:#111;border:0;border-radius:999px;padding:11px 16px;font:600 14px system-ui,"Noto Sans TC",sans-serif;box-shadow:0 6px 18px #0008;cursor:pointer}
.rp-btn.show{display:block}
.rp-mask{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.rp-mask.show{display:flex}
.rp-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
.rp-box h3{margin:0 0 4px;color:var(--accent);font-size:17px}
.rp-box .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.rp-box label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.rp-box textarea,.rp-box input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:14px/1.6 system-ui,"Noto Sans TC",sans-serif}
.rp-box textarea.q{border-left:3px solid var(--accent)}
.rp-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.rp-row .msg{margin-right:auto;font-size:13px;color:var(--muted)}
.rp-row button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.rp-row button.go{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.meta a.rp-link{cursor:pointer}
@media (max-width:820px){nav{position:fixed;left:-280px;transition:left .2s;z-index:6}nav.open{left:0}.top button{display:block}main{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><span class="logo">永恆攻略中文版</span><span class="sub">機器翻譯 · 看到翻錯請反白回報</span><button id="menu">選單</button></div>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<button class="rp-btn" id="rpBtn">📝 回報這段翻譯</button>
<div class="rp-mask" id="rpMask"><div class="rp-box">
<h3>回報翻譯問題</h3><div class="sub" id="rpWhere"></div>
<label>有問題的段落（可修改）</label><textarea class="q" id="rpQuote" rows="3"></textarea>
<label>哪裡錯／建議怎麼翻</label><textarea id="rpNote" rows="4" placeholder="例如：「一次打多個敵人」玩家都說「多目標」"></textarea>
<label>你的名字（選填）</label><input id="rpName" maxlength="40">
<div class="rp-row"><span class="msg" id="rpMsg"></span><button id="rpCancel">取消</button><button class="go" id="rpSend">送出</button></div>
</div></div>
<script src="data.js?v=2cd11b9b"></script>
<script>
(function(){
  const G = window.GUIDES || [];
  const order = ["職業攻略","天梯排名","練功升級","地城","團本","專業技能","任務","其他攻略"];
  const cats = {};
  G.forEach(g => { (cats[g.cat] = cats[g.cat] || []).push(g); });
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  let ICONS = {}, ITEMS = {};
  // 副本英文名 → foreverchanges 繁中頁（「挖掘場：濕地」這種也用冒號前的部分比對）
  const DMAP = {};
  (window.DUNGEONS || []).forEach(d => { DMAP[d.en] = d.slug; DMAP[d.en.split(':')[0].trim()] = d.slug; DMAP[d.en.replace(/^The /, '')] = d.slug; });
  // 統一配色（照遊戲）：物品依品質、技能天賦金黃、職業依職業色、地點副本青色
  const QCOL = ['#9d9d9d', '#ffffff', '#1eff00', '#3d8bff', '#b154ff', '#ff8000'];
  const CLSCOL = {Warrior:'#c69b6d', Paladin:'#f48cba', Hunter:'#aad372', Rogue:'#fff468', Priest:'#ffffff', Shaman:'#0070dd', Mage:'#3fc7eb', Warlock:'#8788ee', Druid:'#ff7c0a'};
  let KINDS = {};
  function kindColor(key, txt){
    const k = KINDS[key] || KINDS[(txt||'').trim()] || '';
    if (k[0] === 'i') return QCOL[+k.slice(1)] || QCOL[1];
    if (k === 's') return '#ffd100';
    if (k === 'c') return CLSCOL[key] || '';
    if (ITEMS[key] || ITEMS[(txt||'').trim()]) return QCOL[1];
    return '';
  }
  function widget(txt){
    // 星號配錯對、把一整句包成粗體的（含句讀又很長）→ 當一般文字
    if (txt.length > 18 && /[，。；]/.test(txt) && !/（[A-Za-z][^）]*）\s*$/.test(txt)) return txt;
    // 粗體裡的「中文（English）」或純英文 → 查圖示表
    const m = txt.match(/（([^（）]+)）\s*$/) || txt.match(/\(([^()]+)\)\s*$/);
    const key = (m ? m[1] : txt).trim();
    const v = ICONS[key] || ICONS[txt.trim()] || '';
    const item = ITEMS[key] || ITEMS[txt.trim()];
    const dh = dungeonHref(key);
    if (dh) return aTag(dh, txt, 'w zone');
    if (!v && !item) return '<b>' + txt + '</b>';
    let [icon, col] = v.split('|');
    col = kindColor(key, txt) || col;
    // 圖示直接引用 Wowhead 圖庫（不存到本站）
    const img = icon ? '<img class="ic" src="https://wow.zamimg.com/images/wow/icons/small/' + icon + '.jpg" onerror="this.style.display=\'none\'" alt="">' : '';
    if (item) return '<a class="w it" href="https://foreverchanges.pro/zh-tw/item/' + item + '" target="_blank" rel="noopener" title="查看物品資料"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</a>';
    return '<b class="w"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</b>';
  }
  // 沒標粗體的「中文（English）」也套圖示：只處理不在標籤裡、不在 b.w 裡的純文字
  function autoWidget(html){
    const parts = html.split(/(<[^>]+>)/); let inW = 0, out = '';
    for (const p of parts) {
      if (p.startsWith('<')) { if (/^<(b class="w"|a )/.test(p)) inW++; else if ((p === '</b>' || p === '</a>') && inW) inW--; out += p; continue; }
      if (inW) { out += p; continue; }
      out += p.replace(/([\u4e00-\u9fff][\u4e00-\u9fff0-9]{0,15})（([A-Za-z][A-Za-z' :\-]{1,40})）/g, (m, zh, en) => (ICONS[en] || ITEMS[en] || DMAP[en] ? widget(zh + '（' + en + '）') : m));
    }
    return out;
  }
  // 連結改寫：我們有翻的攻略 → 站內；副本名 → 我們的副本攻略或 foreverchanges 繁中頁
  const norm = u => (u || '').replace(/[?#].*$/, '').replace(/\/+$/, '').toLowerCase();
  const BYURL = {}; G.forEach(g => { BYURL[norm(g.url)] = g.slug; });
  function dungeonHref(en){
    const slug = DMAP[en] || DMAP[(en||'').replace(/^The /, '')];
    if (!slug) return '';
    const own = G.find(g => g.cat === '地城' && norm(g.url).indexOf(slug) >= 0);
    return own ? '#' + own.slug : 'https://foreverchanges.pro/zh-tw/dungeons/' + slug;
  }
  function linkFor(text, href){
    const inSite = BYURL[norm(href)];
    if (inSite) return '#' + inSite;
    const m = text.match(/（([^（）]+)）\s*$/) || text.match(/\(([^()]+)\)\s*$/);
    const dh = dungeonHref((m ? m[1] : text).trim());
    return dh || href;
  }
  const aTag = (href, text, cls) => '<a' + (cls ? ' class="' + cls + '"' : '') + ' href="' + href + '"' + (href.startsWith('#') ? '' : ' target="_blank" rel="noopener"') + '>' + text + '</a>';
  function inline(s){
    s = esc(s);
    // 程式碼（巨集）先拿出來，不做粗體、圖示、連結處理，最後原樣放回
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0002' + (codes.length - 1) + '\u0003'; });
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, t, h) => { const href = linkFor(t, h.replace(/&amp;/g, '&')); const isZone = /\/dungeons\//.test(href) || (href[0] === '#' && (G.find(x => '#' + x.slug === href) || {}).cat === '地城'); return aTag(href, t, isZone ? 'zone' : ''); });
    s = s.replace(/\*\*([^*]+)\*\*/g, (_, t) => widget(t)).replace(/\*\*+/g, '').replace(/\*([^*]+)\*/g, '<i>$1</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
    return autoWidget(s).replace(/\u0002(\d+)\u0003/g, (_, i) => '<code>' + codes[+i] + '</code>');
  }
  function render(md, g){
    ICONS = g.icons || {}; ITEMS = g.items || {}; KINDS = g.kinds || {};
    // 清掉原網站的雜訊：重複日期、頁面自帶的「目錄」「最新攻略」等區塊、作者／更新於那行（上方已顯示）
    md = md.replace(/((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2}, \d{4})\1/g, '$1');
    md = md.replace(/^.*(作者|By)[：:].*(更新於|Updated).*$/gm, '');
    md = md.replace(/^#{1,3}\s*(目錄|目次|Table of Contents|最新攻略|熱門攻略|相關攻略|推薦攻略|Trending Guides|Related Guides|Latest Guides|留言|評論|Comments)\s*$[\s\S]*?(?=^#{1,2}\s|$(?![\s\S]))/gmi, '');
    md = md.replace(/<([a-z_]*reminder|system[a-z_]*)>[\s\S]*?<\/([a-z_]*reminder|system[a-z_]*)>/g, '');
    // 修掉抓取時誤判的小標題：「### ### X」「- ### X」「| ### X |」
    md = md.replace(/^(#{1,3}) (?:#{1,3} )+/gm, '$1 ').replace(/^(\s*(?:-|\*) )#{1,3} (.+)$/gm, '$1**$2**').replace(/#{1,3} ([^|\n]+?)\s*\|/g, '**$1** |');
    // 整理翻譯時亂掉的星號：「**中文**（English）」→「**中文（English）**」，多餘的 ** / **** 拿掉
    md = md.replace(/（\*\*([^*（）\n]+)\*\*）/g, '（$1）').replace(/\*\*([^*\n]+?)\*\*（([A-Za-z][^（）\n]{1,40})）/g, '**$1（$2）**')
      .replace(/\*{3,}/g, '**').replace(/(^|[ \t：:|])\*\*(?=[ \t|]|$)/gm, '$1');
    const lines = md.split('\n'); let html = '', inList = false, inTable = false, para = [];
    const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    const closeTable = () => { if (inTable) { html += '</table>'; inTable = false; } };
    // 分頁（### ▸ 名稱）：收集成可點的分頁列
    let tabs = null, tabGroups = 0;
    const closeTabs = () => {
      if (!tabs) return;
      flushP(); closeList(); closeTable();
      const gi = tabGroups++;
      let bar = '<div class="tabbar">', panes = '';
      tabs.list.forEach((t, i) => {
        bar += '<button class="tab' + (i === 0 ? ' on' : '') + '" data-g="' + gi + '" data-i="' + i + '">' + inline(t.name) + '</button>';
        panes += '<div class="pane' + (i === 0 ? ' on' : '') + '" data-g="' + gi + '" data-i="' + i + '">' + t.html + '</div>';
      });
      html = tabs.before + '<div class="tabs">' + bar + '</div>' + panes + '</div>';
      tabs = null;
    };
    const startTab = (name) => {
      flushP(); closeList(); closeTable();
      if (!tabs) tabs = { before: html, list: [] };
      else tabs.list[tabs.list.length - 1].html = html.slice(tabs.cursor);
      tabs.list.push({ name, html: '' }); tabs.cursor = html.length;
    };
    const finishTab = () => { if (tabs) { flushP(); closeList(); closeTable(); tabs.list[tabs.list.length - 1].html = html.slice(tabs.cursor); } };
    let firstH1 = true;
    for (let raw of lines) {
      const l = raw.trim();
      if (firstH1 && /^#\s+/.test(l)) { firstH1 = false; html += '<h1>' + esc(g.title) + '</h1>'; continue; }
      let sm;
      if ((sm = l.match(/^\[\[SHOT:talents(?::(\d+))?\]\]$/))) {
        flushP(); closeList(); closeTable();
        const shot = (f, i) => { html += '<img class="shot" src="img/' + f + '?v=' + encodeURIComponent(g.updated || '') + (g.shotVer || '') + '" loading="lazy"><div class="cap">天賦配點' + ((g.shotNames||[])[i] ? '：' + esc(g.shotNames[i]) : '') + '</div>'; };
        if (sm[1] !== undefined) { const i = +sm[1]; if ((g.shots||[])[i]) shot(g.shots[i], i); else html += '<p class="cap">（天賦樹請看原文）</p>'; }
        else { (g.shots || []).forEach(shot); if (!(g.shots||[]).length) html += '<p class="cap">（天賦樹請看原文）</p>'; }
        continue;
      }
      if (!l) { flushP(); closeList(); closeTable(); continue; }
      let m;
      if ((m = l.match(/^###\s+▸\s*(.*)/))) { startTab(m[1]); continue; }
      if ((m = l.match(/^(#{1,3})\s+(.*)/))) { const n = m[1].length; if (tabs && n <= 2) { finishTab(); closeTabs(); } flushP(); closeList(); closeTable(); html += '<h' + (n+0) + '>' + inline(m[2]) + '</h' + (n+0) + '>'; continue; }
      if (l.startsWith('- ') || l.startsWith('* ')) { flushP(); closeTable(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(l.slice(2)) + '</li>'; continue; }
      if (l.startsWith('|')) { flushP(); closeList(); if (!inTable) { html += '<table>'; inTable = true; } const cells = l.split('|').filter((x,i,a)=>i>0&&i<a.length-1); html += '<tr>' + cells.map(c=>'<td>'+inline(c.trim())+'</td>').join('') + '</tr>'; continue; }
      if (l.startsWith('> ')) { flushP(); closeList(); closeTable(); html += '<blockquote>' + inline(l.slice(2)) + '</blockquote>'; continue; }
      closeList(); closeTable(); para.push(l);
    }
    flushP(); closeList(); closeTable();
    if (tabs) { finishTab(); closeTabs(); }
    return html;
  }
  function wireTabs(){
    main.querySelectorAll('.tabbar .tab').forEach(b => b.onclick = () => {
      const i = b.dataset.i, n = b.parentElement.children.length;
      // 同一頁裡分頁數相同的群組一起切換（跟原站一樣）
      main.querySelectorAll('.tabs').forEach(t => {
        if (t.querySelector('.tabbar').children.length !== n) return;
        t.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.i === i));
        t.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.dataset.i === i));
      });
    });
  }
  function classOf(g){
    const cls = ['術士','法師','獵人','牧師','聖騎士','德魯伊','薩滿','盜賊','戰士'];
    for (const c of cls) if (g.title.indexOf(c) >= 0) return c;
    return '';
  }
  const CLASS = {
    '戰士':{i:'⚔️',c:'#C69B6D'},'聖騎士':{i:'🛡️',c:'#F48CBA'},'獵人':{i:'🏹',c:'#AAD372'},'盜賊':{i:'🗡️',c:'#FFF468'},'牧師':{i:'✨',c:'#FFFFFF'},
    '薩滿':{i:'⚡',c:'#0070DD'},'法師':{i:'🔮',c:'#3FC7EB'},'術士':{i:'💀',c:'#8788EE'},'德魯伊':{i:'🐻',c:'#FF7C0A'}
  };
  const CLASS_ORDER = ['戰士','聖騎士','獵人','盜賊','牧師','薩滿','法師','術士','德魯伊'];
  function dates(g){ const u = (g.updated||'').slice(5,16).replace('-', '/'); return '原文 ' + esc(g.date||'') + (u ? ' · 中文版 ' + esc(u) : ''); }
  function specName(g){ const c = classOf(g); return g.title.replace(/（Progress[^）]*）/,'').replace('攻略','').replace(c,'').trim() || g.title; }
  function buildNav(cur){
    const M = 'https://mobalytics.gg/wow-forever/';
    const menu = [
      {t:'首頁', i:'🏠', home:true},
      {t:'天賦模擬器', i:'🧩', ext:M+'talent-calculator'},
      {t:'角色規劃', i:'📋', ext:M+'planner'},
      {t:'職業攻略', i:'⚔️', cat:'職業攻略', ext:M+'classes', byClass:true},
      {t:'練功升級', i:'📈', cat:'練功升級', ext:M+'leveling'},
      {t:'Tier List', i:'🏆', cat:'天梯排名', ext:M+'tier-lists'},
      {t:'地城', i:'🏰', cat:'地城', ext:M+'dungeons'},
      {t:'團本', i:'🐉', cat:'團本', ext:M+'raids'},
      {t:'任務', i:'📜', cat:'任務', ext:M+'quests'},
      {t:'專業技能', i:'⚒️', cat:'專業技能', ext:M+'professions'},
      {t:'新手指南', i:'🧭', cat:'新手指南', ext:M+'guides'},
      {t:'其他攻略', i:'📚', cat:'其他攻略', ext:M+'guides'}
    ];
    const curG = cur ? G.find(x=>x.slug===cur) : null;
    const curCat = curG ? curG.cat : (cur && cur.startsWith('c:') ? '職業攻略' : (cur && cur.startsWith('k:') ? cur.slice(2) : ''));
    const curCls = curG ? classOf(curG) : (cur && cur.startsWith('c:') ? cur.slice(2) : '');
    let h = '';
    const item = g => '<a href="#' + g.slug + '" class="' + (cur===g.slug?'on':'') + '">' + esc(g.title.replace(/（Progress[^）]*）/,'')) + '<span class="d">' + esc(g.date||'') + '</span></a>';
    menu.forEach(m => {
      if (m.home) { h += '<a href="#" class="top ' + (cur ? '' : 'on') + '">' + m.i + ' ' + m.t + '</a>'; return; }
      const list = m.cat ? (cats[m.cat] || []) : [];
      if (!list.length) { if (!m.cat) h += '<a href="' + m.ext + '" class="top ext" target="_blank" rel="noopener">' + m.i + ' ' + m.t + ' <span class="d">英文 ↗</span></a>'; return; }
      const open = m.cat === curCat;
      h += '<a href="#" class="top grp' + (open ? ' open' : '') + '">' + m.i + ' ' + m.t + ' <span class="d">' + list.length + '</span></a><div class="sub' + (open ? ' open' : '') + '">';
      if (m.byClass) {
        const byC = {}; list.forEach(g => { (byC[classOf(g)] = byC[classOf(g)] || []).push(g); });
        CLASS_ORDER.concat(Object.keys(byC).filter(c=>!CLASS_ORDER.includes(c))).forEach(c => {
          if (!byC[c]) return;
          const o = c === curCls, ci = CLASS[c] || {i:'•',c:'#ccc'};
          h += '<a href="#c:' + c + '" class="cls grp' + (o ? ' open' : '') + (cur==='c:'+c?' on':'') + '" style="color:' + ci.c + '">' + ci.i + ' ' + c + ' <span class="d">' + byC[c].length + '</span></a><div class="sub' + (o ? ' open' : '') + '">';
          byC[c].forEach(g => { h += '<a href="#' + g.slug + '" class="' + (cur===g.slug?'on':'') + '">' + esc(specName(g)) + '<span class="d">' + esc(g.date||'') + '</span></a>'; });
          h += '</div>';
        });
      } else list.forEach(g => { h += item(g); });
      h += '<a href="' + m.ext + '" class="more" target="_blank" rel="noopener">更多（英文原站）↗</a></div>';
    });
    nav.innerHTML = h;
    nav.querySelectorAll('a.grp').forEach(a => a.onclick = e => {
      if (a.classList.contains('cls')) { if (!a.classList.contains('open')) return; }
      else e.preventDefault();
      a.classList.toggle('open'); a.nextElementSibling.classList.toggle('open');
    });
  }
  const SECTIONS = [
    {cat:'職業攻略', t:'職業攻略', i:'⚔️', d:'各職業專精的天賦、輸出循環、裝備'},
    {cat:'天梯排名', t:'Tier List', i:'🏆', d:'DPS／補師強度排名'},
    {cat:'練功升級', t:'練功升級', i:'📈', d:'練功路線與傳承點數'},
    {cat:'專業技能', t:'專業技能', i:'⚒️', d:'專業練法、訓練師、配方'},
    {cat:'新手指南', t:'新手指南', i:'🧭', d:'種族、職業組合、路線圖、露營'},
    {cat:'地城', t:'地城', i:'🏰', d:'地城與團本總覽'},
    {cat:'任務', t:'任務', i:'📜', d:'任務流程攻略'},
    {cat:'其他攻略', t:'其他攻略', i:'📚', d:''}
  ];
  function catPage(cat){
    if (cat === '職業攻略') return classGrid('<h1>⚔️ 職業攻略</h1><p class="meta">選一個職業：</p>');
    if (cat === '地城') {
      let h = '<div class="home"><h1>🏰 地城</h1>';
      if ((cats['地城']||[]).length) { h += '<h2>攻略</h2><div class="grid">'; cats['地城'].forEach(g => { h += '<div class="card" onclick="location.hash=\'' + g.slug + '\'"><b>' + esc(g.title) + '</b><div class="c">' + (g.author ? esc(g.author) + ' · ' : '') + dates(g) + '</div></div>'; }); h += '</div>'; }
      const D = window.DUNGEONS || [];
      if (D.length) {
        h += '<h2>副本首領與掉落（繁中）</h2><p class="meta">資料來源：ForeverChanges（點了開新分頁）</p><div class="grid dg">';
        D.forEach(d => { h += '<a class="card dcard" href="https://foreverchanges.pro/zh-tw/dungeons/' + d.slug + '" target="_blank" rel="noopener"><b>' + esc(d.zh) + '</b><div class="c">' + esc(d.en) + ' ↗</div></a>'; });
        h += '</div>';
      }
      return h + '</div>';
    }
    const sec = SECTIONS.find(x => x.cat === cat) || {t:cat, i:''};
    let h = '<div class="home"><h1>' + sec.i + ' ' + esc(sec.t) + '</h1><div class="grid">';
    (cats[cat] || []).forEach(g => { h += '<div class="card" onclick="location.hash=\'' + g.slug + '\'"><b>' + esc(g.title) + '</b><div class="c">' + (g.author ? esc(g.author) + ' · ' : '') + dates(g) + '</div></div>'; });
    return h + '</div></div>';
  }
  function classGrid(head){
    let h = '<div class="home">' + head + '<div class="grid cls">';
    CLASS_ORDER.forEach(c => { const n = (cats['職業攻略']||[]).filter(g=>classOf(g)===c).length; if (!n) return; const ci = CLASS[c]; h += '<div class="card cc" onclick="location.hash=\'c:' + c + '\'" style="border-color:' + ci.c + '55"><b style="color:' + ci.c + '">' + ci.i + ' ' + c + '</b><div class="c">' + n + ' 篇</div></div>'; });
    return h + '</div></div>';
  }
  function classPage(c){
    const ci = CLASS[c] || {i:'',c:'#ccc'};
    const list = (cats['職業攻略']||[]).filter(g => classOf(g) === c);
    let h = '<div class="home"><h1 style="color:' + ci.c + '">' + ci.i + ' ' + c + '</h1><p class="meta">選一個專精：</p><div class="grid">';
    list.forEach(g => { h += '<div class="card" onclick="location.hash=\'' + g.slug + '\'"><b>' + esc(specName(g)) + '</b><div class="c">' + esc(g.title.replace(/^.*（Progress · /,'作者：').replace('）','')) + ' · ' + dates(g) + '</div></div>'; });
    return h + '</div></div>';
  }
  function show(){
    const slug = decodeURIComponent(location.hash.replace('#',''));
    const g = G.find(x => x.slug === slug);
    buildNav(g ? slug : (/^[ck]:/.test(slug) ? slug : ''));
    if (slug.startsWith('c:')) { main.innerHTML = classPage(slug.slice(2)); }
    else if (slug.startsWith('k:')) { main.innerHTML = catPage(slug.slice(2)); }
    else if (!g) {
      let h = '<div class="home"><h1>永恆攻略中文版</h1><p class="meta">WoW Forever 攻略中文版（Progress 公會與經作者同意的攻略），更新於 ' + esc(window.GENERATED||'') + '</p>';
      h += '<div class="tip">📌 先選分類 → 再點攻略。看到翻錯，<b>反白那段文字</b>，右下角會出現「回報這段翻譯」。</div>';
      h += '<h2>攻略分類</h2><div class="grid sec">';
      SECTIONS.forEach(x => { const n = (cats[x.cat]||[]).length + (x.cat === '地城' ? (window.DUNGEONS||[]).length : 0); if (!n) return; h += '<div class="card tile" onclick="location.hash=\'k:' + x.cat + '\'"><span class="ti">' + x.i + '</span><b>' + esc(x.t) + '</b><span class="n">' + (x.cat === '地城' && (window.DUNGEONS||[]).length ? (window.DUNGEONS||[]).length + ' 副本' : n + ' 篇') + '</span>' + (x.d ? '<div class="c">' + esc(x.d) + '</div>' : '') + '</div>'; });
      h += '</div></div>';
      h += classGrid('<h2>依職業找攻略</h2>');
      h += '<div class="home"><h2>最近更新</h2>';
      G.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,6).forEach(g => { h += '<div class="card" onclick="location.hash=\'' + g.slug + '\'"><b>' + esc(g.title) + '</b><div class="c">' + esc(g.cat==='天梯排名'?'Tier List':g.cat) + ' · ' + dates(g) + '</div></div>'; });
      main.innerHTML = h + '</div>';
    } else {
      const body = render(g.md, g);
      main.innerHTML = '<div class="meta">' + esc(g.cat==='天梯排名'?'Tier List':g.cat) + ' · ' + dates(g) + (g.author ? ' · 作者：' + esc(g.author) : '') + ' · <a href="' + g.url + '" target="_blank" rel="noopener">原文 ↗</a> · <a class="rp-link" onclick="window.__openRp()">📝 回報翻譯問題</a>' + (g.authorUrl ? ' · <a href="' + g.authorUrl + '" target="_blank" rel="noopener">' + esc(g.author) + ' 的 Bilibili 國漫 Reaction ↗</a>' : '') + '</div>' + (g.author && g.author.indexOf('Progress') < 0 ? '<p class="meta">本篇經作者 ' + esc(g.author) + ' 同意翻譯，機器翻譯僅供參考，以原文為準。</p>' : '') + body;
      wireTabs();
      // 標題就是一個技能（巨集標題）→ 前面放圖
      const HIC = g.hicons || {};
      main.querySelectorAll('h2,h3,h4').forEach(h => { const k = HIC[h.textContent.trim()]; if (k && !h.querySelector('img')) h.insertAdjacentHTML('afterbegin', '<img class="ic" src="https://wow.zamimg.com/images/wow/icons/small/' + k + '.jpg" onerror="this.style.display=\'none\'" alt="">'); });
      const hs = main.querySelectorAll('h2'); if (hs.length > 1) { let t = '<div class="toc"><b>目錄</b>'; hs.forEach((x,i) => { x.id = 's' + i; t += '<a href="#' + slug + '" onclick="event.preventDefault();document.getElementById(\'s' + i + '\').scrollIntoView({behavior:\'smooth\'})">' + x.textContent + '</a>'; }); const h1 = main.querySelector('h1'); if (h1) h1.insertAdjacentHTML('afterend', t + '</div>'); else main.insertAdjacentHTML('afterbegin', t + '</div>'); }
    }
    window.scrollTo(0,0); nav.classList.remove('open');
  }

  // ===== 回報翻譯 =====
  const rpBtn = document.getElementById('rpBtn'), rpMask = document.getElementById('rpMask');
  const $ = id => document.getElementById(id);
  let rpSel = '', rpSec = '', rpCurSec = '', lastSend = 0;
  function curGuide(){ const slug = decodeURIComponent(location.hash.replace('#','')); return G.find(x => x.slug === slug); }
  function secOf(node){
    let el = node && (node.nodeType === 1 ? node : node.parentElement);
    while (el && el !== main) { let p = el.previousElementSibling; while (p) { if (/^H[123]$/.test(p.tagName)) return p.textContent.trim(); p = p.previousElementSibling; } el = el.parentElement; }
    return '';
  }
  function checkSel(){
    const s = window.getSelection(); const t = s ? s.toString().trim() : '';
    if (t.length >= 2 && t.length <= 600 && curGuide() && s.anchorNode && main.contains(s.anchorNode)) { rpSel = t; rpSec = secOf(s.anchorNode); rpBtn.classList.add('show'); }
    else rpBtn.classList.remove('show');
  }
  document.addEventListener('selectionchange', () => { clearTimeout(checkSel.t); checkSel.t = setTimeout(checkSel, 250); });
  function openRp(quote, sec){
    const g = curGuide(); if (!g) return;
    rpCurSec = sec || ''; $('rpWhere').textContent = g.title + (sec ? '　／　' + sec : '');
    $('rpQuote').value = quote || ''; $('rpNote').value = ''; $('rpMsg').textContent = '';
    try { $('rpName').value = localStorage.getItem('rpName') || ''; } catch (e) {}
    rpMask.classList.add('show'); setTimeout(() => $('rpNote').focus(), 50);
  }
  rpBtn.onclick = () => { openRp(rpSel, rpSec); rpBtn.classList.remove('show'); };
  window.__openRp = () => openRp('', '');
  $('rpCancel').onclick = () => rpMask.classList.remove('show');
  rpMask.onclick = e => { if (e.target === rpMask) rpMask.classList.remove('show'); };
  $('rpSend').onclick = async () => {
    const g = curGuide(), note = $('rpNote').value.trim(), quote = $('rpQuote').value.trim(), name = $('rpName').value.trim();
    if (!g) return;
    if (!note) { $('rpMsg').textContent = '請寫一下哪裡有問題'; return; }
    if (!window.REPORT_HOOK) { $('rpMsg').textContent = '回報功能暫時無法使用'; return; }
    if (Date.now() - lastSend < 20000) { $('rpMsg').textContent = '剛送過，請稍等 20 秒'; return; }
    try { localStorage.setItem('rpName', name); } catch (e) {}
    const cut = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
    const page = location.href.split('#')[0] + '#' + g.slug;
    const embed = { title: cut('📝 ' + g.title, 250), url: page, color: 0xE8B500,
      description: cut((quote ? '**錯誤的翻譯：**\n> ' + quote.replace(/\n/g, '\n> ') + '\n\n' : '') + '**正確應該翻：** ' + note, 3900),
      fields: [{ name: '所在章節', value: cut(rpCurSec || '（未指定）', 200), inline: true },
               { name: '回報人', value: cut(name || '匿名', 80), inline: true },
               { name: '原文', value: '[Mobalytics](' + g.url + ')', inline: true }],
      footer: { text: '攻略代號 ' + g.slug } };
    const fd = new FormData();
    fd.append('payload_json', JSON.stringify({ username: '翻譯回報', embeds: [embed], allowed_mentions: { parse: [] } }));
    $('rpSend').disabled = true; $('rpMsg').textContent = '送出中…';
    try {
      const r = await fetch(window.REPORT_HOOK, { method: 'POST', body: fd });
      if (!r.ok) throw new Error(r.status);
      lastSend = Date.now(); $('rpMsg').textContent = '已送出，謝謝！';
      setTimeout(() => rpMask.classList.remove('show'), 1200);
    } catch (e) { $('rpMsg').textContent = '送出失敗（' + e.message + '），請稍後再試'; }
    $('rpSend').disabled = false;
  };
  document.getElementById('menu').onclick = () => nav.classList.toggle('open');
  window.addEventListener('hashchange', show); show();
})();
</script>
</body>
</html>
