<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永恆攻略中文版</title>
<style>
:root{--zone:#4fd1c5;--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e6e8ee;--muted:#9aa3b2;--accent:#e8b500;--link:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--link)}
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .logo{font-weight:800;letter-spacing:.5px;color:var(--accent)}
.top .sub{color:var(--muted);font-size:13px}
.top button{margin-left:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
nav h4{margin:14px 8px 6px;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--panel2);color:var(--accent);font-weight:600}
nav .d{color:var(--muted);font-size:12px;margin-left:4px}
nav a.top{font-weight:600;font-size:15px;margin-top:2px}
nav a.top.ext{font-weight:500}
nav .sub{display:none;margin:0 0 4px 14px;border-left:1px solid var(--line);padding-left:4px}
nav .sub.open{display:block}
nav .sub a{font-size:13.5px;padding:6px 10px}
nav .sub a.more{color:var(--muted);font-size:12px}
nav a.grp::after{content:'▸';float:right;color:var(--muted)}
nav a.grp.open::after{content:'▾'}
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:980px}
.meta{color:var(--muted);font-size:13px;margin-bottom:14px}
.meta a{color:var(--link)}
main h1{font-size:28px;margin:6px 0 10px}
main h2{font-size:22px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
main h3{font-size:18px;margin:24px 0 8px;color:var(--accent)}
main p{margin:10px 0}
main ul{padding-left:22px}
main li{margin:4px 0}
main img.shot{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:10px 0;display:block}
main .cap{color:var(--muted);font-size:13px;margin:-4px 0 14px}
main .tw{overflow-x:auto;max-width:100%;margin:10px 0;-webkit-overflow-scrolling:touch}
main table{border-collapse:collapse;margin:0;font-size:14px}
main th{background:var(--panel);text-align:left}
main td,main th{border:1px solid var(--line);padding:6px 10px}
main blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:4px 14px;color:var(--muted)}
.home .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;cursor:pointer}
.home .card:hover{border-color:var(--accent)}
.home .card b{font-size:16px}
.home .card .c{color:var(--muted);font-size:13px}
.home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.home .grid .card{margin:0}
.home a.dcard{display:block;text-decoration:none;color:var(--text)}
.home .grid.dg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.home .tip{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);margin:10px 0}
.home .tip b{color:var(--text)}
.home .grid.sec{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.home .card.tile{position:relative;padding:14px 14px 12px}
.home .card.tile .ti{font-size:22px;display:block;margin-bottom:4px}
.home .card.tile .n{position:absolute;top:12px;right:12px;color:var(--accent);font-size:13px;font-weight:700}
.home .grid.cls{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media (max-width:820px){.home .grid.sec{grid-template-columns:1fr 1fr}.home .grid.cls{grid-template-columns:1fr 1fr 1fr;gap:8px}.home .grid.cls .card{padding:10px 8px;text-align:center}.home .grid.cls .card b{font-size:14px}.home h2{margin-top:20px}}
.home h2{font-size:18px;margin:26px 0 8px;border:0}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0 20px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.toc b{width:100%;color:var(--muted);font-size:12px}
.toc a{text-decoration:none}
nav a.cls{font-weight:600}
nav .sub .sub{margin-left:10px}
main b.w,main a.w{font-weight:600;white-space:nowrap}
main a.zone,main a.w.zone{color:var(--zone)}
main a.it{text-decoration:none;border-bottom:1px dotted currentColor}
main a.it:hover{border-bottom-style:solid}
main img.ic{width:18px;height:18px;vertical-align:-4px;margin-right:3px;border-radius:3px;border:1px solid #000}
main h2 img.ic,main h3 img.ic,main h4 img.ic{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:6px}
main code{white-space:pre-wrap}
.tabs{margin:12px 0 18px}
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabbar .tab{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabbar .tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.rp-btn{position:fixed;right:16px;bottom:18px;z-index:20;display:none;background:var(--accent);color:#111;border:0;border-radius:999px;padding:11px 16px;font:600 14px system-ui,"Noto Sans TC",sans-serif;box-shadow:0 6px 18px #0008;cursor:pointer}
.rp-btn.show{display:block}
.rp-btn.float{right:auto;bottom:auto;left:50%;transform:translateX(-50%)}
.rp-mask{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.rp-mask.show{display:flex}
.rp-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
.rp-box h3{margin:0 0 4px;color:var(--accent);font-size:17px}
.rp-box .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.rp-box label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.rp-box textarea,.rp-box input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:14px/1.6 system-ui,"Noto Sans TC",sans-serif}
.rp-box textarea.q{border-left:3px solid var(--accent)}
.rp-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.rp-row .msg{margin-right:auto;font-size:13px;color:var(--muted)}
.rp-row button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.rp-row button.go{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.meta a.rp-link{cursor:pointer}
/* 深色細捲軸（原生亮白捲軸在深色底太刺眼） */
html,nav,.tw,.rp-box{scrollbar-width:thin;scrollbar-color:#3a3f4b transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3a3f4b;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#4b5160}
/* 側欄：名稱靠左，「數字 ▸」整齊靠右 */
nav a.grp{display:flex;align-items:center;gap:6px}
nav a.grp .d{margin-left:auto}
nav a.grp::after{float:none;margin-left:4px;width:10px;text-align:center}
/* 頂部：搜尋框＋外部工具 */
.top .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .tools a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
.top .tools a:hover{color:var(--text);border-color:var(--accent)}
.top input#q{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;width:240px;font:14px system-ui,"Noto Sans TC",sans-serif}
.top input#q:focus{outline:none;border-color:var(--accent)}
.top button{margin-left:0}
.home .recent a{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.home .recent a:hover{color:var(--accent)}
.home .recent .k{color:var(--muted);font-size:12px;flex:none;width:64px}
.home .recent .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home .recent .u{color:var(--muted);font-size:12px;flex:none}
.sr{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sr:hover b{color:var(--accent)}
.sr .c{color:var(--muted);font-size:13px}
.sr mark{background:#e8b50040;color:var(--text);border-radius:3px;padding:0 2px}
/* 官方情報：章節可展開／收起 */
.secbar{display:flex;gap:8px;margin:6px 0 12px}
.secbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
details.sec{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}
details.sec>summary{cursor:pointer;padding:10px 14px;font-size:17px;font-weight:700;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--accent);display:inline-block;width:18px}
details.sec[open]>summary::before{content:'▾'}
details.sec>.body{padding:0 16px 10px}
details.sec>.body>h2:first-child,details.sec>.body>h3:first-child{display:none}
details.sec.sub{background:var(--panel2);margin:8px 0}
details.sec.sub>summary{font-size:15px;padding:8px 12px}
details.sec.sub>.body{padding:0 12px 6px}
@media (max-width:820px){.top .sub,.top .tools a{display:none}.top input#q{width:100%;min-width:0}.top .tools{flex:1}}
@media (max-width:820px){main b.w,main a.w{white-space:normal}main{min-width:0;overflow-wrap:break-word}}
@media (max-width:820px){nav{position:fixed;left:-280px;transition:left .2s;z-index:6}nav.open{left:0}.top button{display:block}main{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><span class="logo">永恆攻略中文版</span><span class="sub">機器翻譯 · 看到翻錯請反白回報</span><div class="tools"><input id="q" type="search" placeholder="🔍 搜尋：防戰、厄運、配方…" autocomplete="off"><a href="https://mobalytics.gg/wow-forever/talent-calculator" target="_blank" rel="noopener">🧩 天賦模擬器 ↗</a><a href="https://mobalytics.gg/wow-forever/planner" target="_blank" rel="noopener">📋 角色規劃 ↗</a></div><button id="menu">選單</button></div>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<button class="rp-btn" id="rpBtn">📝 回報這段翻譯</button>
<div class="rp-mask" id="rpMask"><div class="rp-box">
<h3>回報翻譯問題</h3><div class="sub" id="rpWhere"></div>
<label>有問題的段落（可修改）</label><textarea class="q" id="rpQuote" rows="3"></textarea>
<label>哪裡錯／建議怎麼翻</label><textarea id="rpNote" rows="4" placeholder="例如：「一次打多個敵人」玩家都說「多目標」"></textarea>
<label>你的名字（選填）</label><input id="rpName" maxlength="40">
<div class="rp-row"><span class="msg" id="rpMsg"></span><button id="rpCancel">取消</button><button class="go" id="rpSend">送出</button></div>
</div></div>
<script src="data.js?v=c235fb8e"></script>
<script>
(function(){
  const G = window.GUIDES || [];
  const order = ["官方情報","職業攻略","天梯排名","練功升級","地城","團本","專業技能","任務","其他攻略"];
  const cats = {};
  G.forEach(g => { (cats[g.cat] = cats[g.cat] || []).push(g); });
  if (cats['官方情報']) cats['官方情報'].sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0) || (b.updated || '').localeCompare(a.updated || ''));
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  let ICONS = {}, ZHEN = {}, ITEMS = {}, WHQ = new Set();
  // 副本英文名 → foreverchanges 繁中頁（「挖掘場：濕地」這種也用冒號前的部分比對）
  const DMAP = {};
  (window.DUNGEONS || []).forEach(d => { DMAP[d.en] = d.slug; DMAP[d.en.split(':')[0].trim()] = d.slug; DMAP[d.en.replace(/^The /, '')] = d.slug; });
  // 統一配色（照遊戲）：物品依品質、技能天賦金黃、職業依職業色、地點副本青色
  const QCOL = ['#9d9d9d', '#ffffff', '#1eff00', '#3d8bff', '#b154ff', '#ff8000'];
  const CLSCOL = {Warrior:'#c69b6d', Paladin:'#f48cba', Hunter:'#aad372', Rogue:'#fff468', Priest:'#ffffff', Shaman:'#0070dd', Mage:'#3fc7eb', Warlock:'#8788ee', Druid:'#ff7c0a'};
  let KINDS = {};
  function kindColor(key, txt){
    const k = KINDS[key] || KINDS[(txt||'').trim()] || '';
    if (k[0] === 'i') return QCOL[+k.slice(1)] || QCOL[1];
    if (k === 's') return '#ffd100';
    if (k === 'c') return CLSCOL[key] || CLSCOL[(key || '').split(' ').pop()] || '';
    if (ITEMS[key] || ITEMS[(txt||'').trim()]) return QCOL[1];
    return '';
  }
  function widget(txt){
    // 星號配錯對、把一整句包成粗體的（含句讀又很長）→ 當一般文字
    if (txt.length > 18 && /[，。；]/.test(txt) && !/（[A-Za-z][^）]*）\s*$/.test(txt)) return txt;
    // 粗體裡的「中文（English）」或純英文 → 查圖示表
    const m = txt.match(/（([^（）]+)）\s*$/) || txt.match(/\(([^()]+)\)\s*$/);
    let key = (m ? m[1] : txt).trim();
    // 反過來寫的「Poised（沉著）」：括號裡是中文，就用前面的英文查
    if (m && /[\u4e00-\u9fff]/.test(m[1]) && /^[A-Za-z]/.test(txt)) key = txt.slice(0, txt.indexOf(m[0])).trim();
    // 只寫中文沒附英文（「求生意志」「強韌（被動）」）→ 用中英對照找英文
    if (!ICONS[key] && !ICONS[txt.trim()]) { const z = txt.replace(/（(被動|Passive)）/g, '').replace(/\*\*/g, '').trim(); if (ZHEN[z]) key = ZHEN[z]; }
    const v = ICONS[key] || ICONS[txt.trim()] || '';
    const item = ITEMS[key] || ITEMS[txt.trim()];
    const whq = !item && (WHQ.has(key) || WHQ.has(txt.trim())) ? (WHQ.has(key) ? key : txt.trim()) : '';
    const dh = dungeonHref(key);
    if (dh) return aTag(dh, txt, 'w zone');
    if (!v && !item && !whq) return '<b>' + txt + '</b>';
    let [icon, col] = v.split('|');
    col = kindColor(key, txt) || col;
    // 圖示直接引用 Wowhead 圖庫（不存到本站）
    // Wowhead 圖庫沒有的（天裔精靈、坦克/輸出圖示）→ 改用原文（Mobalytics）的圖
    const alt = (v.split('|')[2] || '').replace(/"/g, '');
    const img = icon ? '<img class="ic" src="https://wow.zamimg.com/images/wow/icons/small/' + icon + '.jpg"' + (alt ? ' data-alt="' + alt + '"' : '') + ' onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.removeAttribute(\'data-alt\')}else this.style.display=\'none\'" alt="">' : '';
    if (item) return '<a class="w it" href="https://foreverchanges.pro/zh-tw/item/' + item + '" target="_blank" rel="noopener" title="查看物品資料"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</a>';
    if (whq) return '<a class="w it" href="https://www.wowhead.com/forever/search?q=' + encodeURIComponent(whq) + '" target="_blank" rel="noopener" title="在 Wowhead 查這個物品"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</a>';
    if (/^[A-Za-z][A-Za-z' :\-]+$/.test(key)) return '<a class="w it" href="https://www.wowhead.com/forever/search?q=' + encodeURIComponent(key) + '" target="_blank" rel="noopener" title="在 Wowhead 查「' + key.replace(/"/g, '') + '」"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</a>';
    return '<b class="w"' + (col ? ' style="color:' + col + '"' : '') + '>' + img + txt + '</b>';
  }
  // 沒標粗體的「中文（English）」也套圖示：只處理不在標籤裡、不在 b.w 裡的純文字
  function autoWidget(html){
    const parts = html.split(/(<[^>]+>)/); let inW = 0, out = '';
    for (const p of parts) {
      if (p.startsWith('<')) { if (/^<(b class="w"|a )/.test(p)) inW++; else if ((p === '</b>' || p === '</a>') && inW) inW--; out += p; continue; }
      if (inW) { out += p; continue; }
      out += p.replace(/([\u4e00-\u9fff][\u4e00-\u9fff0-9·・]{0,15})（([A-Za-z][A-Za-z' :\-]{1,40})）/g, (m, zh, en) => {
          const known = ICONS[en] || ITEMS[en] || DMAP[en] || WHQ.has(en);
          // 語庫沒有的專有名詞（新物品、首領）：英文是「每個字大寫」的名稱 → 至少給 Wowhead 連結
          // 11/11：縮寫（PUG、PPM）、介面名稱、章節名（Spell Overview、Edit Mode、Lockpicking Cap、Notable Trash Mob Loot…）不做 Wowhead 連結
          if (!known && (/^[A-Z]{2,5}$/.test(en) || /(?:^| )(?:Mode|Overview|Displayed|Buffs|Debuffs|Cap|Macros?|Loot|Settings|Options|Frames?|Tips|Guide|Rotation|Priority|Weights?|List|Section|Menu|Window|Panel|Tracker|Addons?|AddOns?|UI)$/.test(en))) return m;
          if (!known && !/^[A-Z][A-Za-z']*(?:[ :\-]+(?:[A-Z][A-Za-z']*|of|the|and|to|in|on|a|an|for|from|with))*$/.test(en)) return m;
          // 「和磨刀石」「搭配風怒」：前面的連接詞不算名字
          const lead = (zh.match(/^(?:級的|級|包括|包含|例如|像是|搭配|使用|以及|還有|和|與|或|及|跟|用|把|將|對|在|從|的|施放|解除|受到|請先完成|完成|搭船到|搭船前往|靠|以)(?=[\u4e00-\u9fff]{2})/) || [''])[0];
          let pre = lead, name = zh.slice(lead.length);
          // 「此懲罰仍適用於暴風雪」「暴風雪觸發祕法集中」：句子黏在名字前面 → 只取最後一個虛詞後面的部分當名字
          if (name.length > 3) { const m2 = name.match(/^(.*(?:觸發|施放|解除|受到|完成|搭船到|搭船前往|使用|搭配|打開|開啟|新增|更新|保持|拾取|抵達|生成的|產生的|召喚的|包括|達到|達成|製作|開好|獲得|取得|購買|影響|提高|提升|降低|增加|減少|移除|調整|脫離|適用|顯示|同時|改為|變成|取代|不再|現在|你的|會|但|於|在|和|與|或|及|讓|對|將|把|從|以|為|是|有|了)的?)([\u4e00-\u9fff0-9·・]{2,})$/); if (m2) { pre += m2[1]; name = m2[2]; } }
          // 「不死族牧師的黑暗犧牲」：「的」前面夠長（4 字以上）才拆；「馬杜克的黑檀劍柄」這種名字本身有「的」就不拆

  }
  // 手機：反白時畫面下方會跳出 Google 搜尋、選取文字旁邊會有「複製」選單
  // → 按鈕放在畫面上方（標題列下面）；反白的地方太靠上時，改放在反白文字的下面
  const TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  function placeBtn(sel){
    if (!TOUCH) { rpBtn.classList.remove('float'); rpBtn.style.top = ''; return; }
    let r = null; try { r = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) {}
    const top = document.querySelector('.top'), hb = top ? top.getBoundingClientRect().bottom : 56;
    let y = hb + 10;
    if (r && r.top < hb + 150) y = Math.min(r.bottom + 14, innerHeight * 0.6);
    rpBtn.classList.add('float'); rpBtn.style.top = Math.max(hb + 10, y) + 'px';
  }
  document.addEventListener('selectionchange', () => { clearTimeout(checkSel.t); checkSel.t = setTimeout(checkSel, 250); });
  addEventListener('scroll', () => { if (rpBtn.classList.contains('show') && TOUCH) { const s = getSelection(); if (s && s.rangeCount) placeBtn(s); } }, {passive: true});
  function openRp(quote, sec){
    const g = curGuide(); if (!g) return;
    rpCurSec = sec || ''; $('rpWhere').textContent = g.title + (sec ? '　／　' + sec : '');
    $('rpQuote').value = quote || ''; $('rpNote').value = ''; $('rpMsg').textContent = '';
    try { $('rpName').value = localStorage.getItem('rpName') || ''; } catch (e) {}
    rpMask.classList.add('show'); setTimeout(() => $('rpNote').focus(), 50);
  }
  rpBtn.onclick = () => { openRp(rpSel, rpSec); rpBtn.classList.remove('show'); };
  window.__openRp = () => openRp('', '');
  $('rpCancel').onclick = () => rpMask.classList.remove('show');
  rpMask.onclick = e => { if (e.target === rpMask) rpMask.classList.remove('show'); };
  $('rpSend').onclick = async () => {
    const g = curGuide(), note = $('rpNote').value.trim(), quote = $('rpQuote').value.trim(), name = $('rpName').value.trim();
    if (!g) return;
    if (!note) { $('rpMsg').textContent = '請寫一下哪裡有問題'; return; }
    if (!window.REPORT_HOOK) { $('rpMsg').textContent = '回報功能暫時無法使用'; return; }
    if (Date.now() - lastSend < 20000) { $('rpMsg').textContent = '剛送過，請稍等 20 秒'; return; }
    try { localStorage.setItem('rpName', name); } catch (e) {}
    const cut = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
    const page = location.href.split('#')[0] + '#' + g.slug;
    const embed = { title: cut('📝 ' + g.title, 250), url: page, color: 0xE8B500,
      description: cut((quote ? '**錯誤的翻譯：**\n> ' + quote.replace(/\n/g, '\n> ') + '\n\n' : '') + '**正確應該翻：** ' + note, 3900),
      fields: [{ name: '所在章節', value: cut(rpCurSec || '（未指定）', 200), inline: true },
               { name: '回報人', value: cut(name || '匿名', 80), inline: true },
               { name: '原文', value: '[Mobalytics](' + g.url + ')', inline: true }],
      footer: { text: '攻略代號 ' + g.slug } };
    const fd = new FormData();
    fd.append('payload_json', JSON.stringify({ username: '翻譯回報', embeds: [embed], allowed_mentions: { parse: [] } }));
    $('rpSend').disabled = true; $('rpMsg').textContent = '送出中…';
    try {
      const r = await fetch(window.REPORT_HOOK, { method: 'POST', body: fd });
      if (!r.ok) throw new Error(r.status);
      lastSend = Date.now(); $('rpMsg').textContent = '已送出，謝謝！';
      setTimeout(() => rpMask.classList.remove('show'), 1200);
    } catch (e) { $('rpMsg').textContent = '送出失敗（' + e.message + '），請稍後再試'; }
    $('rpSend').disabled = false;
  };
  document.getElementById('menu').onclick = () => nav.classList.toggle('open');
  // 拿掉底下沒有內容的章節標題（原文是影片、表格之類抓不到的東西）
  function tidyDom(el){ el.querySelectorAll('h2').forEach(h => { const n = h.nextElementSibling; if (!n || n.tagName === 'H2') h.remove(); }); }
  // ===== 自我檢查：把每一篇實際畫出來，抓畫面上的問題（機器人每輪用瀏覽器呼叫）=====
  window.__auditAll = function(){
    const out = [], box = document.createElement('div');
    G.forEach(g => {
      const p = [], add = s => { if (p.indexOf(s) < 0) p.push(s); };
      NOZH = new Set();
      try { box.innerHTML = render(g.md, g); tidyDom(box); } catch (e) { NOZH = null; out.push({ slug: g.slug, title: g.title, problems: ['畫面產生失敗：' + e.message] }); return; }
      if (NOZH.size) add('語庫查不到台服譯名、只顯示英文：' + [...NOZH].slice(0, 8).join('、'));
      NOZH = null;
      box.querySelectorAll('ul').forEach(ul => { let run = 0, best = 0; [...ul.children].forEach(x => { run = /^\s*\d{1,3}\s*$/.test(x.textContent) ? run + 1 : 0; if (run > best) best = run; }); if (best >= 3) add('有一排純數字的清單（' + best + ' 個）'); });
      const glued = [...box.querySelectorAll('li')].filter(x => /^\s*\d{1,2}[A-Za-z]/.test(x.textContent));
      if (glued.length) add(glued.length + ' 行等級和英文黏在一起，例：' + glued[0].textContent.trim().slice(0, 30));
      const ns = (g.shots || []).length, ni = box.querySelectorAll('img.shot').length;
      if (ni < ns) add('天賦圖只顯示 ' + ni + '/' + ns + ' 張');
      const txt = box.textContent;
      if (/天賦樹請看原文/.test(txt)) add('有天賦圖沒截到');
      // 天賦圖擠在分頁列外面（同一章節有分頁，但這張不屬於任何分頁）
      box.querySelectorAll('img.shot').forEach(im => { if (im.closest('.pane')) return; let n = im.nextElementSibling; while (n && n.tagName !== 'H2') { if (n.classList.contains('tabs')) { add('有天賦圖放在分頁外面（翻譯可能少了一個分頁）'); break; } n = n.nextElementSibling; } });
      const junk = [];
      const plain = box.cloneNode(true); plain.querySelectorAll('code,pre').forEach(x => x.remove());
      const pt = plain.textContent;
      if (/\*\*/.test(pt)) junk.push('**');
      if (/\[\[/.test(pt)) junk.push('[[');
      if (/\]\s*[（(]https?:/.test(pt)) junk.push('](網址)');
      if (/(^|\n)\s*#{1,4}\s/.test(pt)) junk.push('#');
      if (/<\/?(br|p|div|span|a|b|img)\b/i.test(pt)) junk.push('HTML 標籤');
      if (junk.length) add('畫面上露出符號：' + junk.join(' '));
      let en = 0, ex = '';
      plain.querySelectorAll('p,li,td,h2,h3,h4,blockquote').forEach(el => {
        if (el.querySelector('p,li,td')) return;
        const t = el.textContent.trim(); if (/[一-鿿]/.test(t) || /^#show|^\/[a-z]+\b|\/(cast|castsequence|use|target|stopcasting|stopmacro|petattack)\b/.test(t)) return;
        const w = t.match(/[A-Za-z][A-Za-z']+/g) || [];
        if (w.length >= 6 || (/^H/.test(el.tagName) && w.length >= 3)) { en++; if (!ex) ex = t.slice(0, 50); }
      });
      if (en >= 2) add(en + ' 段英文沒翻，例：' + ex);
      box.querySelectorAll('.pane').forEach(x => { if (!x.textContent.trim() && !x.querySelector('img')) add('有空白分頁'); });
      box.querySelectorAll('h2').forEach(h => { const n = h.nextElementSibling; if (!n || n.tagName === 'H2') add('章節「' + h.textContent.trim().slice(0, 20) + '」沒有內容'); });
      // 同一章節的清單：大部分名詞有圖示、有幾個沒有（翻譯只寫中文、查不到圖）
      if (g.cat !== '官方情報') { const secs = []; let cur = { y: 0, n: 0, ex: '' }; secs.push(cur);
        box.querySelectorAll('h2, li').forEach(el => { if (el.tagName === 'H2') { cur = { y: 0, n: 0, ex: '', h: el.textContent.trim() }; secs.push(cur); return; }
          const f = el.firstElementChild; if (!f || el.textContent.trim().indexOf(f.textContent.trim()) !== 0) return;
          if (f.querySelector('img.ic')) cur.y++; else if (f.tagName === 'B' && !/\d|[：:]$|時間|站位|冷卻|消耗|距離|傷害|效果|注意|提示|優點|缺點|範圍|階段|位置|機制|長靴|頭盔|頭部|護肩|肩膀|胸甲|胸部|手套|手部|腰帶|腰部|護腿|腿部|護腕|手腕|披風|背部|戒指|飾品|武器|副手|腳部/.test(f.textContent.trim())) { cur.n++; if (!cur.ex) cur.ex = f.textContent.trim(); } });
        secs.forEach(c => { if (c.y >= 3 && c.n >= 2 && c.y >= c.n) add('「' + (c.h || '開頭') + '」裡有 ' + c.n + ' 個名詞沒圖示，例：' + c.ex); }); }
      let bad = 0; box.querySelectorAll('a').forEach(a => { const h = a.getAttribute('href') || ''; if (!h || /undefined|null|NaN/.test(h)) bad++; });
      if (bad) add(bad + ' 個連結是壞的');
      if (p.length) out.push({ slug: g.slug, title: g.title, problems: p });
    });
    return out;
  };
  window.addEventListener('hashchange', show); show();
})();
</script>
